<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "Admin" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #1d4ed8;
    }

    body {
      background: var(--bg) !important;
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }

    .navbar {
      box-shadow: 0 1px 0 rgba(255,255,255,0.06);
    }

    .navbar .container,
    .container {
      max-width: 1240px;
    }

    .navbar-brand {
      font-weight: 800;
      letter-spacing: 0;
    }

    .navbar .btn {
      border-radius: 8px;
      font-weight: 700;
    }

    .card {
      border-color: var(--line);
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }

    .card-body {
      padding: 20px;
    }

    .btn {
      border-radius: 8px;
      font-weight: 700;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .form-control,
    .form-select {
      border-radius: 8px;
      min-height: 38px;
      border-color: #d1d5db;
      font-size: 14px;
    }

    .form-label {
      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
    }

    table {
      font-size: 14px;
    }

    th {
      color: #64748b;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      background: #f8fafc;
    }

    .text-muted {
      color: var(--muted) !important;
    }

    @media (max-width: 900px) {
      .navbar .container {
        align-items: flex-start;
        gap: 12px;
      }

      .navbar .d-flex {
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .container {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">Clock-In Admin</a>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin_employees') }}">Employees</a>
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin_stores') }}">Stores</a>
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin_shifts') }}">Shifts</a>
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin_payroll') }}">Payroll</a>
      <a class="btn btn-sm btn-warning" href="{{ url_for('admin_logout') }}">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }} mb-3" role="alert">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

</body>
</html>
