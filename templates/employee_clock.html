<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Employee Time Clock</title>

  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --nav: #0f172a;
      --primary: #1f4f82;
      --primary-hover: #183f68;
      --success: #15803d;
      --danger: #dc2626;
      --warning: #b45309;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    .topbar {
      background: var(--nav);
      color: #ffffff;
      padding: 14px 20px;
    }

    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      height: 54px;
      width: auto;
      max-width: 130px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-subtitle {
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }

    main {
      max-width: 760px;
      margin: 28px auto;
      padding: 0 18px 28px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
      margin-bottom: 18px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 800;
      margin: 0;
      line-height: 1.1;
    }

    .muted {
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      color: #4b5563;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      color: var(--text);
      background: #ffffff;
    }

    input:focus,
    select:focus {
      outline: 2px solid rgba(31,79,130,0.16);
      border-color: #93c5fd;
    }

    input:disabled,
    select:disabled {
      background: #f3f4f6;
      color: #4b5563;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      padding: 12px 14px;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    .btn-secondary:hover {
      background: #f8fafc;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: #f8fafc;
      margin-top: 16px;
    }

    .status.success {
      background: #ecfdf5;
      border-color: #bbf7d0;
      color: #14532d;
    }

    .status.warning {
      background: #fffbeb;
      border-color: #fde68a;
      color: #78350f;
    }

    .status.danger {
      background: #fef2f2;
      border-color: #fecaca;
      color: #7f1d1d;
    }

    .shift-panel {
      display: none;
      border: 1px solid #bbf7d0;
      background: #ecfdf5;
      color: #14532d;
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
    }

    .shift-panel.visible {
      display: block;
    }

    .session-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 1px solid var(--line);
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
    }

    .session-name {
      font-weight: 800;
      margin-top: 2px;
    }

    .small {
      font-size: 13px;
    }

    @media (max-width: 640px) {
      main { margin-top: 18px; }
      .card { padding: 18px; }
      .form-grid,
      .actions {
        grid-template-columns: 1fr;
      }
      .session-panel {
        align-items: stretch;
        flex-direction: column;
      }
      .logo {
        height: 46px;
        max-width: 112px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img class="logo" src="{{ url_for('static', filename='img/company-logo.png') }}" alt="C&C logo">
      <div>
        <div class="brand-title">C&amp;C ClockIn</div>
        <div class="brand-subtitle">Employee Time Clock</div>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h1 class="page-title">Employee Time Clock</h1>
      <div class="muted" style="margin-top:8px;">Log in with your employee code and PIN to start.</div>

      <div id="loginPanel">
        <div class="form-grid">
          <div>
            <label for="employee_code">Username / Code</label>
            <input id="employee_code" autocomplete="username" autocapitalize="none" placeholder="johns">
          </div>

          <div>
            <label for="pin">PIN</label>
            <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="1234">
          </div>
        </div>

        <div class="actions">
          <button id="btnLogin" class="btn btn-primary" type="button" onclick="loginEmployee()">Log In</button>
        </div>
      </div>

      <div id="sessionPanel" class="session-panel hidden">
        <div>
          <div class="muted small">Signed in as</div>
          <div id="employeeName" class="session-name">Employee</div>
        </div>
        <button id="btnLogout" class="btn btn-secondary" type="button" onclick="logoutEmployee()">Change Employee</button>
      </div>

      <div id="appPanel" class="hidden">
        <div id="shiftPanel" class="shift-panel">
          <strong id="shiftTitle">Clocked in</strong>
          <div class="small" id="shiftDetails"></div>
        </div>

        <div class="form-grid">
          <div class="field-full">
          <label for="store_select">Store / Location</label>
          <select id="store_select">
            <option value="">Loading stores...</option>
          </select>
          <div id="storeHelp" class="muted small" style="margin-top:7px;">Select your current store before clocking in.</div>
          </div>
        </div>

        <div class="actions">
          <button id="btnClockIn" class="btn btn-primary" type="button" onclick="clockIn()">Clock In</button>
          <button id="btnClockOut" class="btn btn-danger" type="button" onclick="clockOut()">Clock Out</button>
        </div>
      </div>

      <div id="status" class="status small">Ready.</div>
    </section>

    <div class="muted small" style="text-align:center;">
      Store selection is locked while clocked in. Clock-out uses the store tied to your open shift.
    </div>
  </main>

<script>
  const INITIAL_STORES = {{ stores|tojson }};

  const LS_CODE = "web_employee_code";
  const LS_STORE_CODE = "web_selected_store_code";
  const LS_STORE_NAME = "web_selected_store_name";
  const LS_OPEN_SHIFT = "web_open_shift";

  let STORES = [];
  let BUSY = false;
  let openShift = null;
  let currentEmployee = null;

  const elCode = () => document.getElementById("employee_code");
  const elPin = () => document.getElementById("pin");
  const elStore = () => document.getElementById("store_select");
  const elStatus = () => document.getElementById("status");

  function normalizeCode(value) {
    return String(value || "").trim().toLowerCase();
  }

  function setStatus(message, kind = "") {
    const el = elStatus();
    el.className = `status small ${kind}`.trim();
    el.textContent = message;
  }

  function selectedStore() {
    const code = normalizeCode(elStore().value);
    return STORES.find(s => normalizeCode(s.code) === code) || null;
  }

  function persistIdentity() {
    const code = normalizeCode(elCode().value);
    if (code) localStorage.setItem(LS_CODE, code);
  }

  function clearIdentity() {
    localStorage.removeItem(LS_CODE);
    localStorage.removeItem(LS_OPEN_SHIFT);
    currentEmployee = null;
    openShift = null;
  }

  function persistStore(store) {
    if (!store) return;
    localStorage.setItem(LS_STORE_CODE, normalizeCode(store.code));
    localStorage.setItem(LS_STORE_NAME, store.name || store.code);
  }

  function setOpenShift(shift) {
    openShift = shift || null;
    if (openShift) {
      localStorage.setItem(LS_OPEN_SHIFT, JSON.stringify(openShift));
      if (openShift.store_code) {
        localStorage.setItem(LS_STORE_CODE, normalizeCode(openShift.store_code));
        localStorage.setItem(LS_STORE_NAME, openShift.store_name || openShift.store_code);
      }
    } else {
      localStorage.removeItem(LS_OPEN_SHIFT);
    }
    updateUI();
  }

  function updateUI() {
    const isClockedIn = !!openShift;
    const isLoggedIn = !!currentEmployee;
    const store = elStore();
    const loginPanel = document.getElementById("loginPanel");
    const sessionPanel = document.getElementById("sessionPanel");
    const appPanel = document.getElementById("appPanel");
    const employeeName = document.getElementById("employeeName");
    const shiftPanel = document.getElementById("shiftPanel");
    const shiftTitle = document.getElementById("shiftTitle");
    const shiftDetails = document.getElementById("shiftDetails");
    const storeHelp = document.getElementById("storeHelp");

    loginPanel.classList.toggle("hidden", isLoggedIn);
    sessionPanel.classList.toggle("hidden", !isLoggedIn);
    appPanel.classList.toggle("hidden", !isLoggedIn);

    if (currentEmployee) {
      employeeName.textContent = currentEmployee.name || currentEmployee.username_code || "Employee";
    }

    store.disabled = BUSY || isClockedIn || !isLoggedIn;
    document.getElementById("btnLogin").disabled = BUSY;
    document.getElementById("btnClockIn").disabled = BUSY || isClockedIn;
    document.getElementById("btnClockOut").disabled = BUSY || !isClockedIn;
    document.getElementById("btnLogout").disabled = BUSY || isClockedIn;
    elCode().disabled = BUSY || isLoggedIn;
    elPin().disabled = BUSY || isLoggedIn;

    if (isClockedIn) {
      shiftPanel.classList.add("visible");
      shiftTitle.textContent = `Clocked in at ${openShift.store_name || "selected store"}`;
      shiftDetails.textContent = openShift.clock_in_local
        ? `Shift #${openShift.shift_id} started ${openShift.clock_in_local}.`
        : `Shift #${openShift.shift_id}.`;
      storeHelp.textContent = "Store is locked while clocked in.";
      if (openShift.store_code) store.value = normalizeCode(openShift.store_code);
    } else {
      shiftPanel.classList.remove("visible");
      storeHelp.textContent = "Select your current store before clocking in.";
    }
  }

  async function loadStores() {
    try {
      const res = await fetch("/api/stores/all");
      const data = await res.json();
      STORES = Array.isArray(data) ? data : [];
    } catch (e) {
      STORES = Array.isArray(INITIAL_STORES) ? INITIAL_STORES : [];
    }

    if (!STORES.length && Array.isArray(INITIAL_STORES)) {
      STORES = INITIAL_STORES;
    }

    STORES = STORES
      .filter(s => s && s.code)
      .map(s => ({ code: normalizeCode(s.code), name: s.name || s.code }));

    const savedCode = normalizeCode(localStorage.getItem(LS_STORE_CODE));
    const select = elStore();
    select.innerHTML = '<option value="">Select a store...</option>' + STORES.map(s => (
      `<option value="${s.code}">${s.name}</option>`
    )).join("");

    if (savedCode && STORES.some(s => s.code === savedCode)) {
      select.value = savedCode;
    }
  }

  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error("Geolocation is not supported."));
      navigator.geolocation.getCurrentPosition(
        pos => resolve({
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracy_m: pos.coords.accuracy
        }),
        reject,
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    });
  }

  async function refreshStatus({silent = false} = {}) {
    const username_code = normalizeCode(elCode().value);
    const pin = String(elPin().value || "").trim();
    if (!username_code || !pin) return null;

    try {
      const res = await fetch("/api/clock-status", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username_code, pin })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (!silent) setStatus(data.error || "Could not refresh status.", "warning");
        return null;
      }
      currentEmployee = data.employee || currentEmployee;
      setOpenShift(data.open_shift || null);
      if (!silent) {
        setStatus(data.open_shift ? "Active shift found." : "No open shift.", data.open_shift ? "success" : "");
      }
      return data;
    } catch (e) {
      if (!silent) setStatus("Could not refresh status. Check your connection.", "warning");
      return null;
    }
  }

  async function loginEmployee() {
    if (BUSY) return;
    const username_code = normalizeCode(elCode().value);
    const pin = String(elPin().value || "").trim();

    if (!username_code || !pin) return setStatus("Enter your username/code and PIN.", "warning");

    BUSY = true;
    updateUI();
    setStatus("Signing in...");

    const data = await refreshStatus({silent: true});
    BUSY = false;

    if (!data || !data.employee) {
      currentEmployee = null;
      setOpenShift(null);
      updateUI();
      return setStatus("Login failed. Check your username/code and PIN.", "danger");
    }

    currentEmployee = data.employee;
    persistIdentity();
    await loadStores();
    setOpenShift(data.open_shift || null);
    setStatus(data.open_shift ? "Signed in. Active shift found." : "Signed in. Select a store to clock in.", "success");
  }

  function logoutEmployee() {
    if (BUSY) return;
    if (openShift) return setStatus("Clock out before changing employee.", "warning");

    clearIdentity();
    elCode().value = "";
    elPin().value = "";
    updateUI();
    setStatus("Signed out. Enter employee code and PIN.", "");
    elCode().focus();
  }

  async function clockIn() {
    if (BUSY) return;
    const username_code = normalizeCode(elCode().value);
    const pin = String(elPin().value || "").trim();
    const store = selectedStore();

    if (!currentEmployee) return setStatus("Log in before clocking in.", "warning");
    if (!username_code || !pin) return setStatus("Enter your username/code and PIN.", "warning");
    if (!store) return setStatus("Select a store before clocking in.", "warning");

    persistIdentity();
    persistStore(store);
    BUSY = true;
    updateUI();
    setStatus("Getting location...");

    let loc;
    try {
      loc = await getLocation();
    } catch (e) {
      BUSY = false;
      updateUI();
      return setStatus("Location failed. Turn on location services and try again.", "danger");
    }

    setStatus("Clocking in...");
    const res = await fetch("/api/clockin", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username_code,
        pin,
        qr_token: store.code,
        lat: loc.lat,
        lng: loc.lon,
        accuracy_m: loc.accuracy_m
      })
    });

    const data = await res.json().catch(() => ({}));
    BUSY = false;

    if (!res.ok) {
      updateUI();
      return setStatus(data.error || "Clock-in failed.", "danger");
    }

    setOpenShift({
      shift_id: data.shift_id,
      store_name: store.name,
      store_code: store.code,
      clock_in_local: data.clock_in || ""
    });
    setStatus(data.message || "Clock-in successful.", "success");
  }

  async function clockOut() {
    if (BUSY) return;
    const username_code = normalizeCode(elCode().value);
    const pin = String(elPin().value || "").trim();
    if (!currentEmployee) return setStatus("Log in before clocking out.", "warning");
    if (!username_code || !pin) return setStatus("Enter your username/code and PIN.", "warning");

    BUSY = true;
    updateUI();
    setStatus("Getting location...");

    let loc;
    try {
      loc = await getLocation();
    } catch (e) {
      BUSY = false;
      updateUI();
      return setStatus("Location failed. Turn on location services and try again.", "danger");
    }

    setStatus("Clocking out...");
    const res = await fetch("/api/clockout", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username_code,
        pin,
        lat: loc.lat,
        lng: loc.lon,
        accuracy_m: loc.accuracy_m
      })
    });

    const data = await res.json().catch(() => ({}));
    BUSY = false;

    if (!res.ok) {
      if (String(data.error || "").toLowerCase().includes("no open shift")) {
        setOpenShift(null);
      }
      updateUI();
      return setStatus(data.error || "Clock-out failed.", "danger");
    }

    setOpenShift(null);
    setStatus((data.message || "Clock-out successful.") + (data.human ? ` Worked: ${data.human}` : ""), "success");
  }

  window.addEventListener("load", async () => {
    const savedCode = normalizeCode(localStorage.getItem(LS_CODE));
    if (savedCode) elCode().value = savedCode;

    updateUI();
    setStatus(savedCode ? "Enter your PIN to continue." : "Ready.");
  });

  elStore().addEventListener("change", () => {
    const store = selectedStore();
    if (store) persistStore(store);
  });

  elCode().addEventListener("change", () => {
    elCode().value = normalizeCode(elCode().value);
    persistIdentity();
  });

  elPin().addEventListener("keydown", (event) => {
    if (event.key === "Enter") loginEmployee();
  });
</script>
</body>
</html>
